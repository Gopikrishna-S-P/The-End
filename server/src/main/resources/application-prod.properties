# ── Production profile overrides ─────────────────────────────────────────────
# Activated via SPRING_PROFILES_ACTIVE=prod. Everything not overridden here
# inherits from application.properties, which already sources every secret
# and most environment-specific config from env vars (12-factor style) --
# see DEPLOYMENT.md for the full checklist of vars a production deploy must
# set (DB/Redis/JWT/S3/Stripe/mail/CORS/trusted-proxy/etc).

# Don't expose interactive API docs publicly in production (SecurityConfig
# whitelists /swagger-ui/** and /v3/api-docs/** for local/dev convenience).
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
