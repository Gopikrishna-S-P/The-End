# Local dev — git-ignored. Uses H2 in-memory so no external services needed.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

spring.datasource.url=jdbc:h2:mem:opstool;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.jwt.secret=local-dev-secret-at-least-32-chars-long-ok
app.cors.allowed-origins=http://localhost:5173

logging.level.com.recoverpro=DEBUG
