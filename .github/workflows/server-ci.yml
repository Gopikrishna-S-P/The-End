name: server-ci

on:
  push:
    branches: [main, master]
    paths: ['server/**', '.github/workflows/server-ci.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-ci.yml']

defaults:
  run:
    working-directory: server

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opstool
          POSTGRES_USER: opstool
          POSTGRES_PASSWORD: opstool
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opstool -d opstool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/opstool
      DB_USER: opstool
      DB_PASSWORD: opstool
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # CI-only value -- real deployments must set JWT_SECRET from a secrets manager.
      JWT_SECRET: ci-only-github-actions-test-jwt-secret-not-for-production-use

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn test
        run: mvn -B test
